<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos</title>
    <!-- Icono de la pestaña -->
    <link rel="shortcut icon" href="/zimg/OmegaLogo-reducido.png" type="image/x-icon">
    <!-- Enlazamos el archivo CSS externo -->
    <link rel="stylesheet" href="../style/1-alumnos.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
    <header class="Encabezado">
        <div class="Encabezado-Titulos">
            <img src="/zimg/TID-logo.png" alt="Logo-Proyecto" class="Logo-Proyecto">
            <div class="dividor"></div>
            <img src="/zimg/UPGOP-logo.png" alt="Logo-UPGOP" class="Logo-UPGOP">
            <div class="dividor"></div>
            <span class="Titulo-Proyecto">Sistema de evaluación académico.</span>
            <span class="Seccion">Alumnos</span>
        </div>
        <button class="btn-logout">Salir</button>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="Menu-Proyecto">
        
        <!-- Bloque izquierdo: Entradas de texto editables -->
        <section class="Columna-izquierda">
            <!-- Título asignado por el maestro (Solo lectura según las reglas) -->
            <div id="tituloProyecto" class="Titulo" style="display: flex; align-items: center;">Titulo de proyecto</div>
            
            <!-- Descripción con edición compartida en tiempo real -->
            <textarea id="descripcionProyecto" class="Descripcion" placeholder="Descripcion de Proyecto"></textarea>
        </section>

        <!-- Bloque derecho: Botones de acción -->
        <section class="Columna-derecha">
            <button class="btn-evaluar">Evaluar al profesor</button>
            <button class="btn-qr">Descargar QR</button>
        </section>

    </main>

    <footer class="Footer">
        <p class="Footer-Copyright"> © 2026 OmegaDevelopment. Todos los derechos reservados.</p>
        <img src="/zimg/OmegaLogo-completo.jpg" alt="Logo-Empresa" class="Logo-Empresa">
    </footer>

    <!-- SCRIPT DE FIREBASE Y LÓGICA DE ALUMNOS -->
    <script type="module" src="../js/1-alumnos.js"></script>

</body>
</html>
